# ==============================================================================
# 云枢（CloudPivot）后端 workspace 根
#
# 布局（P2-40 落地，2026-11-15）：
#
#     backend/
#       Cargo.toml          ← 本文件（虚拟 workspace 根，**没有** [package]）
#       Cargo.lock          ← 全 workspace 共用一份锁文件（位置不变，脚本/CI/Docker 无需改）
#       target/             ← 全 workspace 共用 target（位置不变：backend/target/**）
#       rustfmt.toml        ← 全 workspace 共用格式基线
#       config/             ← 运行时配置（部署输入，**不进** app 包；cwd = backend/ 时生效）
#       crates/             ← 域 crate（P2-41 起逐个抽取：cloudpivot-doc 已在此）
#       vendor/             ← 框架源码（path 依赖，**不是**成员，见下）
#       app/                ← 主 binary crate（name = cloudpivot）
#         Cargo.toml  src/  tests/  examples/  build.rs  migrations/
#
# 为什么 `migrations/` 跟着 `src/` 一起进了 `app/`：
#   ① 迁移是**这个包**的 schema，和源码同生命周期；`src/**` 里大量的
#      `include_str!("../../../../migrations/…")` 与 `join("migrations")` 都按
#      「源码相对路径 / `CARGO_MANIFEST_DIR`」定位 —— 一起搬，**一行 Rust 都不用改**；
#      只搬 src 会把它们全部指向不存在的目录（编译期/运行期双红）。
#   ② 运行时仍是 `config/config.toml` 的 `[database.migration] path` 决定，见下。
#
# 运行时路径没变（这是本卡刻意保住的兼容面）：
#   - 进程 cwd 仍是 `backend/`（scripts/**、systemd、docker 都是 `cd backend`），
#     所以 `config/`、`uploads/`、`downloads/` 与 `config.toml` 里的相对路径全部照旧；
#   - `[database.migration] path` 由 `"migrations"` 改成 `"app/migrations"`
#     （cwd 相对）；编译期用 `CARGO_MANIFEST_DIR` 定位的那批用例不受影响。
# ==============================================================================

[workspace]
# `crates/*` 是域 crate 的落地位置：P2-41 起每张卡往这里放一个，
# 无需再回来改本文件。`cloudpivot-doc`（P2-27 抽出）已在此。
members = ["app", "crates/*"]

# `vendor/*` 是框架源码（nik 全家桶的 path 依赖，16 个包）。
# **必须 exclude**：
#   ① Cargo 的默认规则是「workspace 目录内的 path 依赖自动成为成员」——不排除的话
#      它们会被吸进 workspace，于是 `cargo fmt --check` / `cargo clippy --workspace`
#      会去格式化与 lint 第三方源码（check.sh 的 L1 立刻红，且红在别人的代码上）；
#   ② 它们各自有自己的版本与格式基线，不该被本仓的 rustfmt.toml 接管。
# 排除只影响「是否算本 workspace 的成员」，不影响它们作为 path 依赖被编译。
#
# ⚠ 必须逐个列全，**不能用 `vendor/*`**：实测 cargo 1.94.1 的 `exclude` 不支持 glob
#   （写成 `exclude = ["vendor/*"]` 时 16 个 vendor 包照样是成员，
#   `cargo metadata | jq .workspace_members` 里全是 `vendor/nik-*`）。
#   新增/删除 vendor 包时同步改这一行 —— 漏掉的会静默变成成员。
exclude = [
    "vendor/nik",
    "vendor/nik-cache",
    "vendor/nik-config",
    "vendor/nik-core",
    "vendor/nik-db",
    "vendor/nik-db-build",
    "vendor/nik-db-core",
    "vendor/nik-db-driver-postgres",
    "vendor/nik-db-macro",
    "vendor/nik-db-sql",
    "vendor/nik-fs",
    "vendor/nik-log",
    "vendor/nik-macros",
    "vendor/nik-plugin",
    "vendor/nik-utils",
    "vendor/nik-web",
]

# resolver 2：edition 2024 的包默认就是 2，这里显式写死，
# 免得以后加进来的 crate 各自用不同 resolver 导致 feature 合并结果不一致。
resolver = "2"
