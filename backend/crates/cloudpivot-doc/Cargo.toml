# cloudpivot-doc —— 业务类型词表（七根轴 · 唯一真相）
#
# P2-27（P2-B 解环）：`shared → erp` 这条回边解掉的产物。
# 词表被 ERP 全域引用，词表的一致性测试又要 import `business::erp::*`；
# 把词表本体搬到一个**零依赖叶子 crate**，crate 图就没有环了。
#
# ⚠ 铁律：`[dependencies]` 永远保持为空。
#   - 本 crate 一旦依赖 `cloudpivot`（或任何框架 crate），P2-B 解掉的环立刻回来；
#   - 它只放枚举 / 常量 / `const fn` 拼写规则，不需要 serde / sqlx / tokio；
#   - 测试按「依赖谁」分两处（P2-29）：只读文件的契约（前端 TS 镜像 / `demo_seed.sh` /
#     巡检 SQL）在本 crate 的 `src/contract_tests.rs`；必须 import 应用代码的那几条
#     （`state_machine` 实体、各 bridge 的 `BIZ_TYPE`）留在应用 crate 的
#     `business/shared/doc_kind_entity_tests.rs` 与 `business/erp/flow_biz_type_contract_tests.rs`。
#     后者不进本 crate —— 否则 `shared → erp → doc` 的回边会重新长出来。
#
# 与应用 crate 的关系：`backend/Cargo.toml` 以 path 依赖引用本 crate。
# P2-28 已把 141 处 `crate::business::shared::doc_kind::*` 调用点改到 `cloudpivot_doc::*`，
# 旧转发垫片 `backend/app/src/business/shared/doc_kind.rs` 已删除 —— 词表现在只有这一份定义。
#
# P2-40（2026-11-15）起本 crate 是 workspace 成员（`backend/Cargo.toml` 的
# `members = ["app", "crates/*"]`），因此：
#     cd backend && cargo test -p cloudpivot-doc      # 只跑本 crate（19 条契约用例）
#     cd backend && cargo fmt -- --check && cargo clippy --all-targets -- -D warnings   # 覆盖全 workspace
# 单独编译也仍然可用（不进 workspace 的老命令）：cd backend/crates/cloudpivot-doc && cargo check

[package]
name = "cloudpivot-doc"
description = "云枢业务类型词表（DocKind / FlowBizType / TxnBizType … 七根轴唯一真相，零依赖）"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
publish = false

[dependencies]
