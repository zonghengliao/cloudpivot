<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 图标集：由 scripts/assets/gen_favicons.py 从 logo.png 生成，改图请重跑脚本 -->
    <!-- ① ICO 多尺寸（16/32/48）：Safari 会无条件先请求 /favicon.ico，Windows 快捷方式也认 -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <!-- ② 高分屏 / 普屏标签页 PNG -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <!-- ③ macOS/iOS 加书签、添加到主屏 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- ④ mask-icon（Safari 固定标签页）需要纯色矢量 path；本项目 logo 是双色栅格云涡，
         未做 favicon.svg（详见 docs/evidence/20261103-favicon/README.md），故不声明 -->
    <title>云枢 CloudPivot</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
