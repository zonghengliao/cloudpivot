<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>① 自研 SVG 画布 · 云枢流程画布方案对比</title>
<link rel="stylesheet" href="./shared-style.css" />
<style>
  /* 本页专属：点阵网格 */
  .poc-dot { fill: var(--cp-dot, #DADFE4); }
</style>
</head>
<body>
<div class="poc-page">
  <!-- ===== 顶部信息栏（技术栈 / 渲染方式 / 包体积 / 依赖） ===== -->
  <header class="poc-head">
    <div class="poc-head__main">
      <div class="poc-head__title">
        <span class="poc-head__badge" style="background:#51697C">方案 ①</span>
        自研 SVG 画布
      </div>
      <div class="poc-head__flow" id="flowName"></div>
    </div>
    <div class="poc-metrics">
      <div class="poc-metric">
        <div class="poc-metric__k">技术栈</div>
        <div class="poc-metric__v">原生 SVG + JS</div>
      </div>
      <div class="poc-metric">
        <div class="poc-metric__k">节点渲染</div>
        <div class="poc-metric__v">HTML in &lt;foreignObject&gt;</div>
      </div>
      <div class="poc-metric">
        <div class="poc-metric__k">运行体积</div>
        <div class="poc-metric__v" id="mSize">—</div>
      </div>
      <div class="poc-metric">
        <div class="poc-metric__k">第三方依赖</div>
        <div class="poc-metric__v is-ok">0 个 / 0 KB</div>
      </div>
      <div class="poc-metric">
        <div class="poc-metric__k">Safari</div>
        <div class="poc-metric__v is-ok" id="mSafari">✅ 已修（见说明）</div>
      </div>
    </div>
  </header>

  <!-- ===== 工具栏 ===== -->
  <div class="poc-tools">
    <div class="poc-zoom">
      <button type="button" id="zoomOut" title="缩小">−</button>
      <span class="poc-zoom__val" id="zoomVal">100%</span>
      <button type="button" id="zoomIn" title="放大">+</button>
      <button type="button" id="zoomFit" title="适应画布">⤢</button>
    </div>
    <span class="poc-hint"><b>拖拽节点</b> · <b>滚轮缩放</b> · 空白处<b>拖动平移</b></span>
    <label class="poc-switch" id="legacyWrap">
      <input type="checkbox" id="legacyToggle" />
      旧写法对照：&lt;g transform&gt;（Safari 会塌陷）
    </label>
  </div>

  <!-- ===== 画布 ===== -->
  <div class="poc-canvas is-idle" id="canvasWrap">
    <svg class="poc-svg" id="canvas" width="100%" height="100%">
      <defs>
        <pattern id="poc-dots" width="18" height="18" patternUnits="userSpaceOnUse">
          <circle class="poc-dot" cx="2" cy="2" r="1.15" />
        </pattern>
      </defs>
      <g id="scene">
        <rect x="-4000" y="-4000" width="12000" height="12000" fill="url(#poc-dots)" />
        <g id="edgesLayer"></g>
        <g id="nodesLayer"></g>
      </g>
    </svg>
    <div class="poc-note">
      <b>这就是生产里在跑的那套写法</b><br />
      卡片走 <code>foreignObject</code>（HTML 排版更稳），
      平移缩放用 <code>svg</code> 自己的 CSS transform ——
      <b>不能</b>给祖先 <code>&lt;g&gt;</code> 加 transform，否则 WebKit 只更新布局不更新绘制，卡片会全糊在左上角。
      勾选右上角开关可以现场复现那个坑。
    </div>
    <div class="poc-fail" id="fail">脚本加载失败，请刷新页面。</div>
  </div>
</div>

<script type="module">
import {
  flowData, NODE, NODE_TYPES, C, edgeGeometry, fitViewport,
} from './shared-data.js';

/* 三个 demo 共用的箭头定义（放在独立 svg 里，三个库都引用同一份 —— 已实测 Chromium/WebKit 均可用） */
const markerHost = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
markerHost.setAttribute('width', '0');
markerHost.setAttribute('height', '0');
markerHost.style.position = 'absolute';
markerHost.innerHTML = `<defs>
  <marker id="poc-arrow" viewBox="0 0 10 8" refX="9" refY="4"
          markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M 0 0 L 10 4 L 0 8 z" fill="${C.brandLight}"></path>
  </marker>
</defs>`;
document.body.appendChild(markerHost);

const SVGNS = 'http://www.w3.org/2000/svg';
const els = (id) => document.getElementById(id);
const wrap = els('canvasWrap');
const svg = els('canvas');
const scene = els('scene');
const nodesLayer = els('nodesLayer');
const edgesLayer = els('edgesLayer');

document.getElementById('flowName').textContent = flowData.name;
// 入口页三栏并排时用 ?embed=1 加载：藏掉自带信息栏/工具栏，改由入口页统一标注
if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('is-embed');

const state = {
  nodes: flowData.nodes.map((n) => ({ ...n })),
  view: { x: 0, y: 0, s: 1 },
  legacy: false,
};
const rectOf = (id) => {
  const n = state.nodes.find((x) => x.id === id);
  return { x: n.x, y: n.y, w: NODE.w, h: NODE.h };
};

/* ---------------- 渲染 ---------------- */
const SHADOW_PAD = 16; // foreignObject 要留出阴影空间，否则 box-shadow 会被裁掉

function buildEdge(edge) {
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'flow-edge');
  g.dataset.edgeKey = `${edge.from}->${edge.to}`;

  const path = document.createElementNS(SVGNS, 'path');
  path.setAttribute('class', 'flow-edge__line');
  path.setAttribute('fill', 'none');
  path.setAttribute('marker-end', 'url(#poc-arrow)');
  g.appendChild(path);

  const label = document.createElementNS(SVGNS, 'g');
  label.setAttribute('class', 'edge-label');
  label.style.display = 'none';
  const bg = document.createElementNS(SVGNS, 'rect');
  bg.setAttribute('class', 'edge-label__bg');
  bg.setAttribute('rx', '4');
  label.appendChild(bg);
  g.appendChild(label);

  g._path = path;
  g._label = label;
  g._bg = bg;
  g._edge = edge;
  return g;
}

function buildNode(node) {
  const meta = NODE_TYPES[node.type];
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'flow-node');
  g.dataset.nodeKey = node.id;
  g.dataset.nodeType = node.type;

  const fo = document.createElementNS(SVGNS, 'foreignObject');
  fo.setAttribute('width', String(NODE.w + SHADOW_PAD * 2));
  fo.setAttribute('height', String(NODE.h + SHADOW_PAD * 2));
  const card = document.createElement('div');
  card.className = 'node-card';
  card.style.setProperty('--node-color', meta.color);
  card.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  card.innerHTML = `
    <span class="node-card__bar"></span>
    <span class="node-card__icon">${meta.icon}</span>
    <span class="node-card__text">
      <span class="node-card__title">${node.name}</span>
      <span class="node-card__sub">${meta.sub}</span>
    </span>`;
  card.style.margin = `${SHADOW_PAD}px`;
  fo.appendChild(card);
  g.appendChild(fo);
  g._fo = fo;
  g._node = node;
  return g;
}

const edgeEls = flowData.edges.map((e) => {
  const el = buildEdge(e);
  edgesLayer.appendChild(el);
  return el;
});
const nodeEls = state.nodes.map((n) => {
  const el = buildNode(n);
  nodesLayer.appendChild(el);
  return el;
});

function layoutNode(el) {
  const n = el._node;
  el._fo.setAttribute('x', String(n.x - SHADOW_PAD));
  el._fo.setAttribute('y', String(n.y - SHADOW_PAD));
}

function layoutEdge(el) {
  const geo = edgeGeometry(el._edge, rectOf);
  el._path.setAttribute('d', geo.d);
  const label = geo.label;
  const g = el._label;
  if (!label) {
    if (g.style.display !== 'none') g.style.display = 'none';
    return;
  }
  g.style.display = '';
  const bg = el._bg;
  bg.setAttribute('x', String(label.x));
  bg.setAttribute('y', String(label.y));
  bg.setAttribute('width', String(label.w));
  bg.setAttribute('height', String(label.h));
  // 文字行（复用已存在的 text 节点，避免每帧重建）
  while (g.childNodes.length - 1 < label.lines.length) {
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '11');
    g.appendChild(t);
  }
  label.lines.forEach((line, i) => {
    const t = g.childNodes[i + 1];
    t.textContent = line;
    t.setAttribute('x', String(label.cx));
    t.setAttribute('y', String(label.baselineY[i]));
  });
}

function render() {
  nodeEls.forEach(layoutNode);
  edgeEls.forEach(layoutEdge);
  applyView();
}

/* ---------------- 平移 / 缩放 ----------------
   Safari 安全路径：transform 落在 <svg> 元素自己身上（CSS），祖先 <g> 一律不加 transform。 */
function applyView() {
  const { x, y, s } = state.view;
  if (state.legacy) {
    svg.style.transform = 'none';
    scene.setAttribute('transform', `translate(${x},${y}) scale(${s})`);
  } else {
    if (scene.hasAttribute('transform')) scene.removeAttribute('transform');
    svg.style.transformOrigin = '0 0';
    svg.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  }
  els('zoomVal').textContent = `${Math.round(s * 100)}%`;
}

function fit() {
  const r = wrap.getBoundingClientRect();
  state.view = fitViewport(r.width, r.height);
  applyView();
}

let pan = null;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.flow-node')) return;
  if (e.target.closest('.poc-note') || e.target.closest('.poc-zoom')) return;
  pan = { px: e.clientX, py: e.clientY, vx: state.view.x, vy: state.view.y };
  wrap.classList.add('is-panning');
  wrap.setPointerCapture(e.pointerId);
});

let drag = null;
nodesLayer.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('.flow-node');
  if (!g) return;
  e.stopPropagation();
  const node = g._node;
  drag = { node, el: g, px: e.clientX, py: e.clientY, nx: node.x, ny: node.y };
  g.classList.add('is-dragging');
  wrap.setPointerCapture(e.pointerId);
});

wrap.addEventListener('pointermove', (e) => {
  if (pan) {
    state.view.x = pan.vx + (e.clientX - pan.px);
    state.view.y = pan.vy + (e.clientY - pan.py);
    applyView();
  } else if (drag) {
    const s = state.view.s || 1;
    drag.node.x = drag.nx + (e.clientX - drag.px) / s;
    drag.node.y = drag.ny + (e.clientY - drag.py) / s;
    layoutNode(drag.el);
    edgeEls.forEach((el) => {
      if (el._edge.from === drag.node.id || el._edge.to === drag.node.id) layoutEdge(el);
    });
  }
});

const endPointer = () => {
  if (pan) { pan = null; wrap.classList.remove('is-panning'); }
  if (drag) { drag.el.classList.remove('is-dragging'); drag = null; }
};
wrap.addEventListener('pointerup', endPointer);
wrap.addEventListener('pointercancel', endPointer);

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = wrap.getBoundingClientRect();
  const cx = e.clientX - r.left;
  const cy = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0015);
  const s = Math.min(2, Math.max(0.3, state.view.s * k));
  const ratio = s / state.view.s;
  state.view.x = cx - (cx - state.view.x) * ratio;
  state.view.y = cy - (cy - state.view.y) * ratio;
  state.view.s = s;
  applyView();
}, { passive: false });

els('zoomIn').onclick = () => zoomBy(1.2);
els('zoomOut').onclick = () => zoomBy(1 / 1.2);
els('zoomFit').onclick = fit;
function zoomBy(k) {
  const r = wrap.getBoundingClientRect();
  const cx = r.width / 2;
  const cy = r.height / 2;
  const s = Math.min(2, Math.max(0.3, state.view.s * k));
  const ratio = s / state.view.s;
  state.view.x = cx - (cx - state.view.x) * ratio;
  state.view.y = cy - (cy - state.view.y) * ratio;
  state.view.s = s;
  applyView();
}

els('legacyToggle').addEventListener('change', (e) => {
  state.legacy = e.target.checked;
  els('legacyWrap').classList.toggle('poc-switch--on', state.legacy);
  applyView();
});

/* ---------------- 就绪 ---------------- */
render();
fit();
new ResizeObserver(() => { if (state.view.s === 1) fit(); }).observe(wrap);

// 体积：本页 HTML（含内联脚本）实测字节数，页面自己报，省得手填
fetch(location.href, { cache: 'no-store' })
  .then((r) => r.text())
  .then((t) => {
    const kb = new Blob([t]).size / 1024;
    els('mSize').textContent = `${kb.toFixed(1)} KB（本页自述）`;
  })
  .catch(() => {});

window.__poc = {
  engine: 'native',
  ready: true,
  edges: () => document.querySelectorAll('.flow-edge__line').length,
  nodes: () =>
    [...document.querySelectorAll('.flow-node')].map((g) => {
      const r = g.getBoundingClientRect();
      return { id: g.dataset.nodeKey, x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) };
    }),
  zoom: () => state.view.s,
  fit,
  setLegacy: (v) => { state.legacy = v; els('legacyToggle').checked = v; applyView(); },
};
</script>
</body>
</html>
