# 云枢应用日志的保留口径（journald）
#
# 为什么有这份文件：cloudpivot 的三个 systemd 单元都是 StandardOutput=journal，
# 应用日志只存在于 journal，logrotate 摸不到。journald 默认「按容量回收、不按时间
# 回收」（无 MaxRetentionSec），因此「保留 30 天」这条需求必须在这里落地。
#
# 安装位置：/etc/systemd/journald.conf.d/cloudpivot-retention.conf
# 落地方式：bash scripts/ops/logrotate/install.sh [--host HOST]
# 生效方式：systemctl restart systemd-journald（install.sh 内容变化时才重启）
#
# 语义：
#   MaxFileSec=1day        → 按天切分 journal 文件（对应「按天切割」）
#   MaxRetentionSec=30day  → 超过 30 天的条目在每次轮转时删除（对应「保留 30 天」）
#   SystemMaxUse=2G        → 容量兜底：磁盘异常增长时先按容量回收，不让 journal 吃满 /var/log
#   SystemMaxFileSize=128M → 单个文件上限，避免一天的文件过大难以搬迁
#   Storage=persistent     → 落盘持久化（两台机器 /var/log/journal 本就存在，行为不变）
#
# 影响面（必须知道）：journald 的配置是整机的，不是按服务隔离的。
#   本文件对 144/145 上所有写入 journal 的进程（sshd、nginx、hermes、cron…）同样生效，
#   「保留 30 天」是全机口径，不只是 cloudpivot。若要按服务差异化，只能用
#   journalctl --vacuum-time 之类的清理手段，journald 不提供 per-unit 保留期。
[Journal]
Storage=persistent
MaxFileSec=1day
MaxRetentionSec=30day
SystemMaxUse=2G
SystemMaxFileSize=128M
